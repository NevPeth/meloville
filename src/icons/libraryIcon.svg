<svg xmlns="http://www.w3.org/2000/svg"
     width="224"
     height="224"
     viewBox="0 0 224 224">

  <defs>
    <linearGradient id="fillGradient"
                    x1="8%"
                    y1="5%"
                    x2="92%"
                    y2="95%">
      <stop offset="0%" stop-color="{START_COLOR}"/>
      <stop offset="22%" stop-color="{STOP1}"/>
      <stop offset="52%" stop-color="{STOP2}"/>
      <stop offset="78%" stop-color="{STOP3}"/>
      <stop offset="100%" stop-color="{END_COLOR}"/>
    </linearGradient>
  </defs>

  <rect
    x="0"
    y="0"
    width="224"
    height="224"
    rx="24"
    fill="url(#fillGradient)"/>

  <g transform="translate(-2,-9)">
    <line x1="80" y1="79.3333" x2="80" y2="170.6667"
          stroke="white" stroke-width="10.6667" stroke-linecap="round"/>

    <line x1="101.3333" y1="79.3333" x2="101.3333" y2="170.6667"
          stroke="white" stroke-width="10.6667" stroke-linecap="round"/>

    <polygon
      points="122.6667,79.3333 149.3333,95.3333 149.3333,165.3333 122.6667,170.6667"
      stroke="white"
      stroke-width="10.6667"
      fill="none"
      stroke-linejoin="round"
    />
  </g>
</svg>